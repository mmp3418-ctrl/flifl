<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وادي فليفل قروب القابضة | WADI FLAFL GROUP HOLDING</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           CSS VARIABLES & THEMES
           ========================================= */
        :root {
            --bg-primary: #FDFBF7;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F7F2EA;
            --bg-dark: #0D3B36;
            --bg-dark-secondary: #124F48;
            
            --text-primary: #1A202C;
            --text-secondary: #4A5568;
            --text-light: #718096;
            --text-on-dark: #FDFBF7;
            --text-on-dark-secondary: #B8C4C2;
            
            --brand-gold: #FFCC00;
            --brand-orange: #E65100;
            --brand-red: #6E1A24;
            --brand-teal: #0D3B36;
            --brand-accent: #F29100;
            
            --accent-gold: #E65100;
            --accent-gold-hover: #CC4400;
            --accent-gold-light: rgba(230, 81, 0, 0.10);
            --accent-gold-border: rgba(230, 81, 0, 0.25);
            
            --border-color: #EBE3D5;
            --border-light: #F5EFE6;
            
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px rgba(13, 59, 54, 0.08);
            --glass-blur: blur(24px) saturate(180%);
            
            --header-bg: rgba(253, 251, 247, 0.7);
            --header-bg-scrolled: rgba(253, 251, 247, 0.92);
            
            --card-shadow: 0 4px 24px rgba(13, 59, 54, 0.06);
            --card-shadow-hover: 0 24px 60px rgba(13, 59, 54, 0.15);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-slow: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        [data-theme="dark"] {
            --bg-primary: #081F1C;
            --bg-secondary: #0D3B36;
            --bg-tertiary: #124F48;
            --bg-dark: #041210;
            --bg-dark-secondary: #081F1C;
            
            --text-primary: #FDFBF7;
            --text-secondary: #B8C4C2;
            --text-light: #7A8A87;
            --text-on-dark: #FDFBF7;
            --text-on-dark-secondary: #B8C4C2;
            
            --accent-gold: #F29100;
            --accent-gold-hover: #FFCC00;
            --accent-gold-light: rgba(242, 145, 0, 0.12);
            --accent-gold-border: rgba(242, 145, 0, 0.3);
            
            --border-color: #1E5C54;
            --border-light: #124F48;
            
            --glass-bg: rgba(13, 59, 54, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            
            --header-bg: rgba(8, 31, 28, 0.7);
            --header-bg-scrolled: rgba(8, 31, 28, 0.92);
            
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            --card-shadow-hover: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        /* =========================================
           GLOBAL RESET & TYPOGRAPHY
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        body {
            font-family: 'Cairo', 'Lato', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color 0.5s ease, color 0.5s ease;
            overflow-x: hidden;
        }

        body[dir="ltr"] {
            font-family: 'Lato', 'Cairo', sans-serif;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', 'Cairo', serif;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-primary);
        }

        body[dir="ltr"] h1, body[dir="ltr"] h2, body[dir="ltr"] h3, body[dir="ltr"] h4 {
            font-family: 'Cormorant Garamond', serif;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 0 2.5rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1.25rem;
            }
        }

        /* =========================================
           UTILITY CLASSES
           ========================================= */
        .section-padding {
            padding: 8rem 0;
        }

        @media (max-width: 768px) {
            .section-padding {
                padding: 4rem 0;
            }
        }

        .gold-line {
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, var(--brand-orange), var(--brand-gold));
            margin-bottom: 1.5rem;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .section-title {
            font-size: clamp(1.8rem, 4.5vw, 3.5rem);
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            font-weight: 800;
        }

        .section-subtitle {
            font-size: clamp(0.9rem, 1.4vw, 1.1rem);
            color: var(--text-secondary);
            margin-bottom: 3.5rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Modern Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 1rem 2.2rem;
            font-size: 0.9rem;
            font-weight: 700;
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            border-radius: 50px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
        }

        .btn i {
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: translateX(-4px);
        }

        body[dir="ltr"] .btn:hover i {
            transform: translateX(4px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            color: #FFFFFF;
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(230, 81, 0, 0.3);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(230, 81, 0, 0.45);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            transform: translateY(-3px);
            background-color: var(--accent-gold-light);
            box-shadow: 0 8px 25px rgba(230, 81, 0, 0.15);
        }

        .btn-outline-light {
            background-color: transparent;
            color: #FFFFFF;
            border-color: rgba(255,255,255,0.5);
        }

        .btn-outline-light:hover {
            border-color: var(--brand-gold);
            color: var(--brand-gold);
            transform: translateY(-3px);
            background-color: rgba(255, 204, 0, 0.1);
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.2);
        }

        /* =========================================
           HEADER - MODERN GLASSMORPHISM
           ========================================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: var(--header-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: var(--transition);
        }

        header.scrolled {
            background-color: var(--header-bg-scrolled);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(13, 59, 54, 0.08);
        }

        /* Subtle gradient bottom line */
        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--brand-orange), var(--brand-gold), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        header.scrolled::after {
            opacity: 0.6;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 82px;
            transition: height 0.4s ease;
        }

        header.scrolled .header-inner {
            height: 70px;
        }

        /* Logo with subtle radial glow */
        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            flex-shrink: 0;
            position: relative;
            padding: 4px 8px;
            transition: var(--transition);
        }

        /* Subtle radial glow behind the logo */
        .logo::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255, 204, 0, 0.18) 0%, rgba(242, 145, 0, 0.08) 40%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.7;
            transition: var(--transition);
        }

        .logo:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .logo img {
            height: 52px;
            width: auto;
            transition: height 0.4s ease;
            position: relative;
            z-index: 1;
        }

        header.scrolled .logo img {
            height: 42px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
            position: relative;
            z-index: 1;
        }

        .logo-text .brand-name {
            font-family: 'Cairo', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: 0.3px;
            transition: font-size 0.4s ease;
        }

        header.scrolled .logo-text .brand-name {
            font-size: 1rem;
        }

        .logo-text .brand-sub {
            font-family: 'Cairo', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--brand-orange);
            letter-spacing: 2px;
            margin-top: 2px;
            transition: font-size 0.4s ease;
        }

        header.scrolled .logo-text .brand-sub {
            font-size: 0.6rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            position: relative;
            letter-spacing: 0.3px;
            padding: 0.5rem 0;
        }

        .nav-links a:hover {
            color: var(--brand-orange);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--brand-orange), var(--brand-gold));
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.4);
            border: 1.5px solid rgba(230, 81, 0, 0.15);
            color: var(--text-primary);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        [data-theme="dark"] .icon-btn {
            background: rgba(13, 59, 54, 0.4);
        }

        .icon-btn:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 10px 25px rgba(230, 81, 0, 0.25);
            background-color: var(--accent-gold-light);
        }

        .lang-btn {
            font-size: 0.75rem;
            font-weight: 800;
            width: auto;
            padding: 0 1.2rem;
            border-radius: 25px;
            gap: 0.5rem;
            letter-spacing: 0.5px;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 8px;
            flex-shrink: 0;
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2.5px;
            background-color: var(--text-primary);
            transition: var(--transition);
            border-radius: 2px;
        }

        @media (max-width: 992px) {
            .nav-links {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .header-actions .lang-btn span {
                display: none;
            }
            .header-actions .lang-btn {
                width: 42px;
                padding: 0;
                border-radius: 12px;
            }
        }

        @media (max-width: 768px) {
            .header-inner {
                height: 80px;
            }
            header.scrolled .header-inner {
                height: 70px;
            }
            .logo img {
                height: 56px;
            }
            header.scrolled .logo img {
                height: 48px;
            }
            .logo-text .brand-name {
                font-size: 1rem;
            }
            header.scrolled .logo-text .brand-name {
                font-size: 0.9rem;
            }
            .logo-text .brand-sub {
                font-size: 0.6rem;
                letter-spacing: 1.5px;
            }
            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 0.9rem;
            }
            .lang-btn {
                width: 40px;
            }
        }

        @media (max-width: 480px) {
            .header-inner {
                height: 74px;
            }
            header.scrolled .header-inner {
                height: 66px;
            }
            .logo img {
                height: 50px;
            }
            header.scrolled .logo img {
                height: 44px;
            }
            .logo-text .brand-name {
                font-size: 0.85rem;
            }
            header.scrolled .logo-text .brand-name {
                font-size: 0.8rem;
            }
            .logo-text .brand-sub {
                display: none;
            }
            .icon-btn {
                width: 38px;
                height: 38px;
                font-size: 0.85rem;
            }
            .lang-btn {
                width: 38px;
            }
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 80px;
            left: 0;
            width: 100%;
            height: calc(100vh - 80px);
            background-color: var(--bg-secondary);
            z-index: 999;
            overflow-y: auto;
            padding: 2rem 1.5rem;
            border-top: 1px solid var(--border-color);
            animation: slideDown 0.3s ease;
            backdrop-filter: blur(20px);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu ul {
            display: flex;
            flex-direction: column;
        }

        .mobile-menu ul li {
            border-bottom: 1px solid var(--border-color);
        }

        .mobile-menu ul li a {
            display: block;
            padding: 1.2rem 0;
            font-size: 1.05rem;
            color: var(--text-primary);
            transition: var(--transition);
            font-weight: 600;
        }

        .mobile-menu ul li a:hover {
            color: var(--brand-orange);
            padding-right: 12px;
        }

        body[dir="ltr"] .mobile-menu ul li a:hover {
            padding-right: 0;
            padding-left: 12px;
        }

        @media (max-width: 768px) {
            .mobile-menu {
                top: 80px;
                height: calc(100vh - 80px);
            }
        }

        @media (max-width: 480px) {
            .mobile-menu {
                top: 74px;
                height: calc(100vh - 74px);
            }
        }

        /* =========================================
           HERO SECTION
           ========================================= */
        .hero {
            position: relative;
            height: 100vh;
            min-height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            transition: transform 12s ease;
        }

        .hero:hover .hero-bg {
            transform: scale(1.08);
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(13, 59, 54, 0.88) 0%, rgba(13, 59, 54, 0.6) 50%, rgba(13, 59, 54, 0.92) 100%);
            z-index: -1;
        }

        .hero-content {
            max-width: 950px;
            padding: 0 1.5rem;
            color: #FFFFFF;
            animation: fadeInUp 1.2s ease;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1.5rem;
            background: rgba(255, 204, 0, 0.15);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--brand-gold);
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
            backdrop-filter: blur(10px);
        }

        .hero-badge i {
            font-size: 1rem;
        }

        .hero-content h1 {
            font-size: clamp(2rem, 6vw, 4.5rem);
            margin-bottom: 1.5rem;
            font-weight: 900;
            text-shadow: 0 4px 30px rgba(0,0,0,0.4);
            line-height: 1.15;
            color: #FFFFFF;
        }

        .hero-content p {
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            margin-bottom: 3rem;
            opacity: 0.95;
            font-weight: 400;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.9;
            color: #FFFFFF;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .hero-buttons {
                flex-direction: column;
                align-items: center;
            }
            .hero-buttons .btn {
                width: 100%;
                max-width: 300px;
            }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================
           STATS BAR
           ========================================= */
        .stats-bar {
            background: var(--bg-dark);
            padding: 2.5rem 0;
            position: relative;
            overflow: hidden;
        }

        .stats-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 204, 0, 0.05), transparent);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            text-align: center;
            padding: 1rem;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item:first-child {
            border-left: none;
        }

        body[dir="ltr"] .stat-item {
            border-left: none;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        body[dir="ltr"] .stat-item:first-child {
            border-right: none;
        }

        .stat-item .stat-icon {
            font-size: 1.8rem;
            color: var(--brand-gold);
            margin-bottom: 0.8rem;
        }

        .stat-item .stat-label {
            font-size: 0.9rem;
            color: var(--text-on-dark);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
            .stat-item {
                border-left: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding-bottom: 1.5rem;
            }
            .stat-item:nth-child(3),
            .stat-item:nth-child(4) {
                border-bottom: none;
                padding-bottom: 1rem;
            }
            body[dir="ltr"] .stat-item {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            body[dir="ltr"] .stat-item:nth-child(3),
            body[dir="ltr"] .stat-item:nth-child(4) {
                border-bottom: none;
            }
        }

        /* =========================================
           SECTORS SECTION
           ========================================= */
        .sectors-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .sector-card {
            position: relative;
            padding: 3rem 2.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            transition: var(--transition);
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .sector-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(180deg, var(--brand-orange), var(--brand-gold));
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.6s ease;
        }

        .sector-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(230, 81, 0, 0.06) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .sector-card:hover::before {
            transform: scaleY(1);
        }

        .sector-card:hover::after {
            opacity: 1;
        }

        .sector-card:hover {
            border-color: var(--accent-gold-border);
            transform: translateY(-10px);
            box-shadow: var(--card-shadow-hover);
        }

        body[dir="ltr"] .sector-card::before {
            right: auto;
            left: 0;
        }

        .sector-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.8rem;
            position: relative;
            z-index: 1;
        }

        .sector-icon-wrap {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            border-radius: 20px;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(230, 81, 0, 0.3);
            transition: var(--transition);
        }

        .sector-card:hover .sector-icon-wrap {
            transform: rotate(-6deg) scale(1.05);
            box-shadow: 0 15px 40px rgba(230, 81, 0, 0.45);
        }

        .sector-icon-wrap i {
            font-size: 2.2rem;
            color: #FFFFFF;
        }

        .sector-title h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }

        .sector-title .sector-en {
            font-family: 'Lato', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-orange);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .sector-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.9;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .sector-features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .sector-features span {
            font-size: 0.75rem;
            padding: 0.4rem 0.9rem;
            background: var(--accent-gold-light);
            color: var(--brand-orange);
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid var(--accent-gold-border);
            transition: var(--transition);
        }

        .sector-features span:hover {
            background: var(--brand-orange);
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        @media (max-width: 992px) {
            .sectors-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        @media (max-width: 576px) {
            .sector-card {
                padding: 2rem 1.5rem;
            }
            .sector-icon-wrap {
                width: 65px;
                height: 65px;
                border-radius: 16px;
            }
            .sector-icon-wrap i {
                font-size: 1.8rem;
            }
            .sector-title h3 {
                font-size: 1.25rem;
            }
            .sector-header {
                gap: 1rem;
                margin-bottom: 1.3rem;
            }
        }

        /* =========================================
           ABOUT SECTION
           ========================================= */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-image {
            position: relative;
            height: 550px;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }

        .about-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s ease;
        }

        .about-image:hover img {
            transform: scale(1.08);
        }

        .about-image::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--brand-orange), var(--brand-gold));
        }

        .about-text h2 {
            margin-bottom: 0.5rem;
        }

        .about-text .gold-line {
            margin-bottom: 2rem;
        }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 1.3rem;
            font-size: 1rem;
            line-height: 1.9;
        }

        @media (max-width: 992px) {
            .about-grid {
                grid-template-columns: 1fr;
                gap: 2.5rem;
            }
            .about-image {
                height: 400px;
            }
        }

        /* =========================================
           VISION / MISSION / VALUES
           ========================================= */
        .vmv-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .vmv-card {
            background: var(--bg-secondary);
            padding: 3rem 2rem;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }

        .vmv-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--brand-orange), var(--brand-gold), var(--brand-red));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.6s ease;
        }

        .vmv-card:hover::before {
            transform: scaleX(1);
        }

        .vmv-card:hover {
            border-color: var(--accent-gold-border);
            transform: translateY(-10px);
            box-shadow: var(--card-shadow-hover);
        }

        .vmv-icon-wrap {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-gold-light), rgba(255, 204, 0, 0.15));
            border-radius: 50%;
            margin: 0 auto 1.8rem;
            border: 2px solid var(--accent-gold-border);
            transition: var(--transition);
        }

        .vmv-card:hover .vmv-icon-wrap {
            transform: scale(1.1) rotate(-5deg);
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            border-color: transparent;
        }

        .vmv-icon-wrap i {
            font-size: 2rem;
            color: var(--brand-orange);
            transition: var(--transition);
        }

        .vmv-card:hover .vmv-icon-wrap i {
            color: #FFFFFF;
        }

        .vmv-card h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.35rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .vmv-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.9;
        }

        .values-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .values-list span {
            background-color: var(--bg-tertiary);
            padding: 0.5rem 1.1rem;
            border-radius: 25px;
            font-size: 0.8rem;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            font-weight: 600;
        }

        .values-list span:hover {
            border-color: var(--brand-orange);
            color: var(--brand-orange);
            transform: translateY(-3px) scale(1.05);
            background-color: var(--accent-gold-light);
            box-shadow: 0 8px 20px rgba(230, 81, 0, 0.15);
        }

        @media (max-width: 992px) {
            .vmv-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =========================================
           HOW WE WORK
           ========================================= */
        .how-work-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
        }

        .work-step {
            position: relative;
            padding: 2.5rem 1.8rem;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .work-step:hover {
            border-color: var(--accent-gold-border);
            transform: translateY(-10px);
            box-shadow: var(--card-shadow-hover);
        }

        .work-step-icon {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-gold-light), rgba(255, 204, 0, 0.15));
            border-radius: 50%;
            margin: 0 auto 1rem;
            border: 2px solid var(--accent-gold-border);
            transition: var(--transition);
        }

        .work-step:hover .work-step-icon {
            transform: scale(1.1);
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            border-color: transparent;
        }

        .work-step-icon i {
            font-size: 1.5rem;
            color: var(--brand-orange);
            transition: var(--transition);
        }

        .work-step:hover .work-step-icon i {
            color: #FFFFFF;
        }

        .work-step .step-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.8rem;
        }

        .work-step h4 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .work-step p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        @media (max-width: 992px) {
            .how-work-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.2rem;
            }
        }

        @media (max-width: 576px) {
            .how-work-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .work-step {
                padding: 2rem 1.5rem;
            }
        }

        /* =========================================
           GALLERY SECTION
           ========================================= */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s ease;
        }

        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(13, 59, 54, 0.8));
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .gallery-item::before {
            content: '\f00e';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 60px;
            height: 60px;
            background: var(--brand-orange);
            color: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            z-index: 2;
            transition: transform 0.4s ease;
            opacity: 0;
        }

        .gallery-item:hover::after {
            opacity: 1;
        }

        .gallery-item:hover::before {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .gallery-item:hover img {
            transform: scale(1.15);
        }

        .gallery-item:hover {
            border-color: var(--brand-orange);
            box-shadow: var(--card-shadow-hover);
            transform: translateY(-5px);
        }

        @media (max-width: 992px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.7rem;
            }
            .gallery-item {
                border-radius: 12px;
            }
        }

        /* =========================================
           PRESENCE SECTION
           ========================================= */
        .presence-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }

        .presence-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
        }

        .presence-card:hover {
            border-color: var(--accent-gold-border);
            transform: translateY(-10px);
            box-shadow: var(--card-shadow-hover);
        }

        .presence-card .presence-info {
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
        }

        .presence-card .presence-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--brand-orange), var(--brand-gold));
        }

        .presence-card .presence-icon {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            box-shadow: 0 15px 35px rgba(230, 81, 0, 0.3);
            transition: var(--transition);
        }

        .presence-card:hover .presence-icon {
            transform: scale(1.1) rotate(-8deg);
            box-shadow: 0 20px 45px rgba(230, 81, 0, 0.5);
        }

        .presence-card .presence-icon i {
            font-size: 2.5rem;
            color: #FFFFFF;
        }

        .presence-card .presence-info h3 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.7rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .presence-card .presence-info .sub {
            font-size: 0.75rem;
            color: var(--brand-orange);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1.2rem;
            font-weight: 800;
        }

        .presence-card .presence-info p {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.9;
            margin-bottom: 1.5rem;
        }

        /* =========================================
           WORK DETAILS SECTION
           ========================================= */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .detail-item {
            padding: 2.5rem 2rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            transition: var(--transition);
            position: relative;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .detail-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--brand-orange), var(--brand-gold));
            border-radius: 20px 20px 0 0;
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .detail-item:hover::before {
            transform: scaleX(1);
        }

        .detail-item:hover {
            border-color: var(--accent-gold-border);
            transform: translateY(-8px);
            box-shadow: var(--card-shadow-hover);
        }

        .detail-icon-wrap {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-gold-light), rgba(255, 204, 0, 0.15));
            border-radius: 50%;
            margin: 0 auto 1.2rem;
            border: 2px solid var(--accent-gold-border);
            transition: var(--transition);
        }

        .detail-item:hover .detail-icon-wrap {
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            border-color: transparent;
            transform: scale(1.1);
        }

        .detail-icon-wrap i {
            font-size: 1.6rem;
            color: var(--brand-orange);
            transition: var(--transition);
        }

        .detail-item:hover .detail-icon-wrap i {
            color: #FFFFFF;
        }

        .detail-item h4 {
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 0.8rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .detail-item p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .detail-item {
                padding: 2rem 1.5rem;
            }
        }

        /* =========================================
           CONTACT SECTION
           ========================================= */
        .contact-section {
            background-color: var(--bg-secondary);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .contact-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, var(--accent-gold-light) 0%, transparent 60%);
            opacity: 0.8;
        }

        .contact-section h2 {
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
            color: var(--text-primary);
            font-weight: 800;
        }

        .contact-section > .container > p {
            color: var(--text-secondary);
            margin-bottom: 3rem;
            font-size: 1rem;
            position: relative;
            z-index: 1;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 3rem;
            position: relative;
            z-index: 1;
            max-width: 850px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 2.5rem 1.8rem;
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            transition: var(--transition);
            text-align: center;
        }

        .contact-card:hover {
            border-color: var(--accent-gold-border);
            transform: translateY(-8px);
            box-shadow: var(--card-shadow-hover);
        }

        .contact-card .contact-icon {
            font-size: 1.8rem;
            color: #FFFFFF;
            margin-bottom: 1.2rem;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 10px 25px rgba(230, 81, 0, 0.3);
            transition: var(--transition);
        }

        .contact-card:hover .contact-icon {
            transform: scale(1.1) rotate(-8deg);
            box-shadow: 0 15px 35px rgba(230, 81, 0, 0.5);
        }

        .contact-card .contact-number {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
            font-family: 'Lato', sans-serif;
            letter-spacing: 1px;
            direction: ltr;
        }

        .contact-card .contact-buttons {
            display: flex;
            gap: 0.7rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .contact-card .contact-buttons .btn {
            padding: 0.7rem 1.3rem;
            font-size: 0.8rem;
        }

        .contact-location {
            position: relative;
            z-index: 1;
            margin-top: 1.5rem;
        }

        .contact-location a {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.1rem 2.8rem;
            background: linear-gradient(135deg, var(--brand-orange), var(--brand-accent));
            color: #FFFFFF;
            border-radius: 50px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: var(--transition);
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(230, 81, 0, 0.3);
        }

        .contact-location a:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(230, 81, 0, 0.45);
        }

        .contact-location a i {
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
            .contact-card {
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 576px) {
            .contact-card .contact-buttons {
                flex-direction: column;
                align-items: center;
            }
            .contact-card .contact-buttons .btn {
                width: 100%;
                max-width: 260px;
            }
        }

        /* =========================================
           FOOTER
           ========================================= */
        footer {
            background: var(--bg-dark);
            color: var(--text-on-dark-secondary);
            padding: 5rem 0 2rem;
            transition: background-color 0.5s ease;
            position: relative;
            backdrop-filter: blur(20px);
        }

        [data-theme="dark"] footer {
            background: var(--bg-dark-secondary);
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--brand-orange), var(--brand-gold), transparent);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .footer-brand .logo-placeholder {
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 0.3px;
            margin-bottom: 0.5rem;
        }

        .footer-brand .footer-sub {
            font-family: 'Cairo', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--brand-gold);
            letter-spacing: 2px;
            margin-bottom: 1.2rem;
        }

        .footer-brand p {
            font-size: 0.9rem;
            opacity: 0.85;
            line-height: 1.9;
            max-width: 380px;
        }

        .footer-links h4 {
            color: #FFFFFF;
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.7rem;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
        }

        .footer-links h4::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 35px;
            height: 3px;
            background: linear-gradient(90deg, var(--brand-orange), var(--brand-gold));
            border-radius: 3px;
        }

        body[dir="ltr"] .footer-links h4::after {
            right: auto;
            left: 0;
        }

        .footer-links ul li {
            margin-bottom: 0.9rem;
        }

        .footer-links ul li a {
            font-size: 0.9rem;
            opacity: 0.8;
            transition: var(--transition);
            display: inline-block;
            color: var(--text-on-dark-secondary);
        }

        .footer-links ul li a:hover {
            color: var(--brand-gold);
            opacity: 1;
            transform: translateX(-6px);
        }

        body[dir="ltr"] .footer-links ul li a:hover {
            transform: translateX(6px);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        @media (max-width: 992px) {
            .footer-grid {
                grid-template-columns: 1fr 1fr;
                gap: 2.5rem;
            }
        }

        @media (max-width: 576px) {
            .footer-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .footer-brand p {
                max-width: 100%;
            }
        }

        /* =========================================
           REVEAL ANIMATIONS
           ========================================= */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal {
                opacity: 1;
                transform: none;
                transition: none;
            }
            html {
                scroll-behavior: auto;
            }
            .hero:hover .hero-bg {
                transform: none;
            }
        }

        /* =========================================
           SCROLLBAR
           ========================================= */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--brand-orange), var(--brand-accent));
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--brand-orange);
        }
    </style>

                footerCopyright: "© 2026 WADI FLAFL GROUP HOLDING — All rights reserved."
            }
        };

        let currentLang = localStorage.getItem('wfg_lang') || SITE_CONFIG.defaultLang;
        let currentTheme = localStorage.getItem('wfg_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initLanguage();
            renderContent();
            initMobileMenu();
            initScrollReveal();
            initSmoothScroll();
            initHeaderScroll();
        });

        function initTheme() {
            document.documentElement.setAttribute('data-theme', currentTheme);
            updateThemeIcon();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('wfg_theme', currentTheme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.querySelector('#themeToggle i');
            if (currentTheme === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        function initLanguage() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            updateLangButton();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('wfg_lang', currentLang);
            initLanguage();
            renderContent();
        }

        function updateLangButton() {
            const btn = document.getElementById('langToggle');
            btn.innerHTML = `<i class="fas fa-globe"></i> <span>${currentLang === 'ar' ? 'EN' : 'AR'}</span>`;
        }

        function renderContent() {
            const t = TRANSLATIONS[currentLang];
            const companyName = currentLang === 'ar' ? SITE_CONFIG.companyName : SITE_CONFIG.companyNameEn;
            
            // Header Logo
            const headerLogo = document.getElementById('headerLogo');
            headerLogo.innerHTML = `
                <img src="${SITE_CONFIG.mainLogo}" alt="${companyName}" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="logo-text" style="display:flex;">
                    <span class="brand-name">${companyName}</span>
                    <span class="brand-sub">GROUP HOLDING</span>
                </div>
            `;

            // Navigation
            const navItems = [
                { href: "#home", text: t.navHome },
                { href: "#sectors", text: t.navSectors },
                { href: "#about", text: t.navAbout },
                { href: "#how-we-work", text: t.navHow },
                { href: "#gallery", text: t.navGallery },
                { href: "#contact", text: t.navContact }
            ];

            document.getElementById('desktopNav').innerHTML = navItems.map(item => `<a href="${item.href}">${item.text}</a>`).join('');
            document.getElementById('mobileNavList').innerHTML = navItems.map(item => `<li><a href="${item.href}" class="mobile-link">${item.text}</a></li>`).join('');

            // Hero
            document.getElementById('heroBg').src = SITE_CONFIG.images.hero;
            document.getElementById('heroBadge').textContent = t.heroBadge;
            document.getElementById('heroTitle').textContent = t.heroTitle;
            document.getElementById('heroDesc').textContent = t.heroDesc;
            document.getElementById('heroBtn1').textContent = t.heroBtn1;
            document.getElementById('heroBtn2').textContent = t.heroBtn2;

            // Stats
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = t.stats.map(stat => `
                <div class="stat-item">
                    <div class="stat-icon"><i class="fas ${stat.icon}"></i></div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');

            // Sectors
            document.getElementById('sectorsTitle').textContent = t.sectorsTitle;
            document.getElementById('sectorsSubtitle').textContent = t.sectorsSubtitle;
            const sectorsGrid = document.getElementById('sectorsGrid');
            sectorsGrid.innerHTML = t.sectors.map(sector => `
                <div class="sector-card reveal">
                    <div class="sector-header">
                        <div class="sector-icon-wrap">
                            <i class="fas ${sector.icon}"></i>
                        </div>
                        <div class="sector-title">
                            <h3>${sector.nameAr}</h3>
                            <div class="sector-en">${sector.nameEn}</div>
                        </div>
                    </div>
                    <p class="sector-desc">${sector.desc}</p>
                    <div class="sector-features">
                        ${sector.features.map(f => `<span>${f}</span>`).join('')}
                    </div>
                </div>
            `).join('');

            // About
            document.getElementById('aboutImg').src = SITE_CONFIG.images.about;
            document.getElementById('aboutTitle').textContent = t.aboutTitle;
            document.getElementById('aboutP1').textContent = t.aboutP1;
            document.getElementById('aboutP2').textContent = t.aboutP2;

            // VMV
            document.getElementById('visionTitle').textContent = t.visionTitle;
            document.getElementById('visionText').textContent = t.visionText;
            document.getElementById('missionTitle').textContent = t.missionTitle;
            document.getElementById('missionText').textContent = t.missionText;
            document.getElementById('valuesTitle').textContent = t.valuesTitle;
            document.getElementById('valuesList').innerHTML = t.values.map(v => `<span>${v}</span>`).join('');

            // How We Work
            document.getElementById('howTitle').textContent = t.howTitle;
            document.getElementById('howSubtitle').textContent = t.howSubtitle;
            document.getElementById('step1Title').textContent = t.step1Title;
            document.getElementById('step1Desc').textContent = t.step1Desc;
            document.getElementById('step2Title').textContent = t.step2Title;
            document.getElementById('step2Desc').textContent = t.step2Desc;
            document.getElementById('step3Title').textContent = t.step3Title;
            document.getElementById('step3Desc').textContent = t.step3Desc;
            document.getElementById('step4Title').textContent = t.step4Title;
            document.getElementById('step4Desc').textContent = t.step4Desc;

            // Gallery
            document.getElementById('galleryTitle').textContent = t.galleryTitle;
            document.getElementById('gallerySubtitle').textContent = t.gallerySubtitle;
            const galleryGrid = document.getElementById('galleryGrid');
            const galleryImages = [
                SITE_CONFIG.images.g1, SITE_CONFIG.images.g2, SITE_CONFIG.images.g3, SITE_CONFIG.images.g4,
                SITE_CONFIG.images.g5, SITE_CONFIG.images.g6, SITE_CONFIG.images.g7, SITE_CONFIG.images.g8
            ];
            galleryGrid.innerHTML = galleryImages.map((img, i) => `
                <div class="gallery-item reveal">
                    <img src="${img}" alt="Gallery Image ${i + 1}" loading="lazy">
                </div>
            `).join('');

            // Presence
            document.getElementById('presenceTitle').textContent = t.presenceTitle;
            const presenceGrid = document.getElementById('presenceGrid');
            presenceGrid.innerHTML = t.presence.map(p => `
                <div class="presence-card reveal">
                    <div class="presence-info">
                        <div class="presence-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <h3>${p.city}</h3>
                        <div class="sub">${p.sub}</div>
                        <p>${p.desc}</p>
                    </div>
                </div>
            `).join('');

            // Work Details
            document.getElementById('detailHoursTitle').textContent = t.detailHoursTitle;
            document.getElementById('detailHoursText').textContent = t.detailHoursText;
            document.getElementById('detailCoverageTitle').textContent = t.detailCoverageTitle;
            document.getElementById('detailCoverageText').textContent = t.detailCoverageText;
            document.getElementById('detailPartnersTitle').textContent = t.detailPartnersTitle;
            document.getElementById('detailPartnersText').textContent = t.detailPartnersText;

            // Contact
            document.getElementById('contactTitle').textContent = t.contactTitle;
            document.getElementById('contactDesc').textContent = t.contactDesc;
            
            const contactGrid = document.getElementById('contactGrid');
            contactGrid.innerHTML = SITE_CONFIG.phones.map(phone => `
                <div class="contact-card reveal">
                    <div class="contact-icon"><i class="fas fa-phone-alt"></i></div>
                    <div class="contact-number">${phone.display}</div>
                    <div class="contact-buttons">
                        <a href="tel:${phone.number}" class="btn btn-primary">
                            <i class="fas fa-phone"></i> ${t.contactBtnCall}
                        </a>
                        <a href="https://wa.me/${phone.whatsapp}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">
                            <i class="fab fa-whatsapp"></i> ${t.contactBtnWhatsapp}
                        </a>
                    </div>
                </div>
            `).join('');

            document.getElementById('contactMapLink').href = SITE_CONFIG.locationLink;
            document.getElementById('contactMapText').textContent = t.contactMapText;

            // Footer
            document.getElementById('footerLogo').textContent = companyName;
            document.getElementById('footerDesc').textContent = t.footerDesc;
            document.getElementById('footerNavTitle').textContent = t.footerNavTitle;
            document.getElementById('footerServicesTitle').textContent = t.footerServicesTitle;
            document.getElementById('footerCopyright').textContent = t.footerCopyright;

            document.getElementById('footerNavList').innerHTML = navItems.map(item => `<li><a href="${item.href}">${item.text}</a></li>`).join('');
            document.getElementById('footerServicesList').innerHTML = t.sectors.map(s => `<li><a href="#sectors">${s.nameAr}</a></li>`).join('');

            initScrollReveal();
        }

        function initMobileMenu() {
            const menuBtn = document.getElementById('mobileMenuBtn');
            const mobileMenu = document.getElementById('mobileMenu');
            
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('active');
                const spans = menuBtn.querySelectorAll('span');
                if (mobileMenu.classList.contains('active')) {
                    spans[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
                    spans[1].style.opacity = '0';
                    spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
                } else {
                    spans[0].style.transform = 'none';
                    spans[1].style.opacity = '1';
                    spans[2].style.transform = 'none';
                }
            });

            mobileMenu.addEventListener('click', (e) => {
                if (e.target.tagName === 'A') {
                    mobileMenu.classList.remove('active');
                    const spans = menuBtn.querySelectorAll('span');
                    spans[0].style.transform = 'none';
                    spans[1].style.opacity = '1';
                    spans[2].style.transform = 'none';
                }
            });
        }

        function initScrollReveal() {
            const reveals = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
            reveals.forEach(reveal => revealObserver.observe(reveal));
        }

        function initSmoothScroll() {
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        const headerOffset = 85;
                        const elementPosition = target.getBoundingClientRect().top;
                        const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                    }
                });
            });
        }

        function initHeaderScroll() {
            const header = document.getElementById('mainHeader');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        }

        document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        document.getElementById('langToggle').addEventListener('click', toggleLanguage);

        window.addEventListener('resize', () => {
            if (window.innerWidth > 992) {
                const mobileMenu = document.getElementById('mobileMenu');
                if (mobileMenu.classList.contains('active')) {
                    mobileMenu.classList.remove('active');
                    const spans = document.querySelector('#mobileMenuBtn').querySelectorAll('span');
                    spans[0].style.transform = 'none';
                    spans[1].style.opacity = '1';
                    spans[2].style.transform = 'none';
                }
            }
        });
    </script>
</body>
</html>
